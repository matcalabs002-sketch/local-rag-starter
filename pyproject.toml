[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-rag-starter"
version = "0.1.0"
description = "A local-first RAG chatbot starter with cited answers and atomic source updates."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "streamlit>=1.66,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4",
  "pgvector>=0.4,<1", "numpy>=2,<3", "certifi>=2025",
  "langchain-text-splitters>=0.3,<2", "pypdf>=5,<7", "docx2txt>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/matcalabs002-sketch/local-rag-starter"
Documentation = "https://github.com/matcalabs002-sketch/local-rag-starter/blob/main/TUTORIAL.md"
Issues = "https://github.com/matcalabs002-sketch/local-rag-starter/issues"

[project.optional-dependencies]
drive = ["google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3", "pip-tools>=7.5,<8"]
docs = ["Markdown>=3.10,<4"]

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.setuptools.package-data]
rag = ["schema.sql", "workspace/*.css"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".private", ".venv", "START-HERE.html"]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires an isolated disposable local PostgreSQL/pgvector database"]
